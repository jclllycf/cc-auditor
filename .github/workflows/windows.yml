name: Windows offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-core:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify merged PR tree for forbidden paths and sensitive content
        if: github.event_name == 'pull_request'
        run: python -B -c "from public_build.release_guard import audit_tree; audit_tree('.', git_checkout=True)"
      - name: Checkout exact source tree for signed public manifest
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python -m pip install -r requirements-build.txt
      - name: Verify declared release or development source contract
        run: python -B -m public_build.verify_ci
      - name: Offline regression tests (synthetic only)
        run: python -B -m public_build.run_tests
      - name: Actual stdio startup and synthetic PDF output
        run: python -B -m public_build.verify_product --synthetic-dir scratch/ci-synthetic
      - name: v3.7 synthetic diagnostics and before-after comparison
        run: python -B -m public_build.demo_v37
